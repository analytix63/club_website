<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Choose member or administrator sign in for ANALYTIX.">
    <title>Sign in | ANALYTIX</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <main class="login-shell">
        <a class="back-link" href="index.html">← Back to ANALYTIX</a>
        <section class="login-card" aria-labelledby="pageTitle">
            <p class="eyebrow">ANALYTIX · SIGN IN</p>
            <h1 id="pageTitle">Welcome back</h1>
            <p class="intro">Choose the sign-in area you need.</p>

            <div class="login-options">
                <a class="option-card member-option" href="member/account.html">
                    <span class="option-icon" aria-hidden="true">👤</span>
                    <span class="option-copy">
                        <strong>Member Login</strong>
                        <span>Sign in or create your member account.</span>
                    </span>
                    <span class="arrow" aria-hidden="true">→</span>
                </a>

                <a class="option-card admin-option" href="admin/admin.html">
                    <span class="option-icon" aria-hidden="true">⚙</span>
                    <span class="option-copy">
                        <strong>Admin Login</strong>
                        <span>For authorized club administrators.</span>
                    </span>
                    <span class="arrow" aria-hidden="true">→</span>
                </a>
            </div>
            <p class="security-note">Admin access is limited to accounts approved by ANALYTIX.</p>
        </section>
    </main>
</body>

</html>
